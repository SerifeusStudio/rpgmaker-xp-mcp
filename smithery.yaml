# Smithery configuration — https://smithery.ai/docs/build/project-config/smithery.yaml
#
# This server is stdio-only and edits files on the machine it runs on: it reads
# and writes an RPG Maker XP project's .rxdata in place. It is not a hosted
# service and there is nothing useful to run remotely.
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - rpgmakerProjectPath
    properties:
      rpgmakerProjectPath:
        type: string
        title: RPG Maker XP project path
        description: >-
          Path to the project FOLDER — the one containing Game.rxproj and Data/.
          Not the Data/ directory itself and not the .rxproj file.
      rpgmakerRtpPath:
        type: string
        title: RTP path
        description: >-
          Where the RPG Maker XP RTP assets live. Only set this if your RTP is
          not at the default Steam install location. The RTP is read from your
          own installation; nothing is bundled or redistributed.
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: ['dist/index.js'],
      env: Object.assign(
        { RPGMAKER_PROJECT_PATH: config.rpgmakerProjectPath },
        config.rpgmakerRtpPath ? { RPGMAKER_RTP_PATH: config.rpgmakerRtpPath } : {}
      )
    })
